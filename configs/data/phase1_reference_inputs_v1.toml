  "verified expiry dates",
  "execution-instrument registration",
  "time-to-expiry and roll state",
  "terminal delivery-avoidance exit",
]

[trading_status]
schema = "status"
output = "data/reference/glbx-mdp3/status"
point_in_time_required = true
required_semantics = [
  "trading-state changes",
  "halts, pauses, and resumptions",
  "session-validity intervals",
]
blocks = [
  "trading-status features",
  "eligible-session calendar",
  "missing versus intentionally closed classification",
]

[qualification]
