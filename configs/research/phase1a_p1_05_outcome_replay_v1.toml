source_footer_manifest = "data/derived/manifests/mbp10_footer_manifest_v1.jsonl"
source_sha256_manifest = "data/derived/manifests/mbp10_source_sha256_v1.jsonl"
eligible_calendar_artifact = "data/derived/manifests/phase1a_screening_source_date_calendar_v1.json"
split_artifact = "data/derived/manifests/phase1a_performance_free_split_v1.json"

[cache]
schema = "systematic_fx.phase1a_daily_executable_cache.v1"
request_index_schema = "systematic_fx.phase1a_daily_executable_cache_index.v1"
version = "phase1a_daily_executable_cache_v1"
partition_key = ["source_date", "raw_symbol"]
maximum_parallel_workers = 4
maximum_in_flight_partitions = 4
worker_unit = "ONE_CACHE_KEY"
expected_partition_count = 478
expected_plan_sha256 = "3ad39a9bff36e0eae1c87687bf38108b663394624582167bdbf5d848fe5b0252"
raw_partition_build_count = "ONCE_PER_CONTENT_IDENTITY"
semantic_request_index_required = true
retain_invalid_observations = true
retain_source_row_lineage = true
output_directory = "data/derived/backtest_event_cache/phase1a_daily_executable_cache_v1"

[replay]
logical_passes = 1
expected_completed_source_date_count = 478
expected_last_completed_source_date = "2023-08-31"
global_event_order = ["ts_recv_ns", "sequence", "event_index", "contract_key"]
signal_time_field = "bucket_end_ns"
contract_field = "variables.contract"
first_touch_observation_active_sessions = 20
first_touch_unresolved_status = "CENSORED"
portfolio_position_continues_after_censor = true
occupied_signal_behavior = "LOG_AND_SKIP"
occupancy_key = ["scenario_id", "direction", "contract_key", "grid_cell_id"]
same_timestamp_tie_break = "STOP_FIRST"
terminal_exit = "LAST_VALID_EXECUTABLE_QUOTE_BEFORE_EXPIRY_MONTH_START"
terminal_partition_resolution = "REVERSE_SCAN_LAST_VALID_EXECUTABLE_QUOTE_PARTITION_V1"
terminal_exit_failure = "HARD_FAILURE"

[checkpoint]
boundary = "SOURCE_DATE_COMPLETE"
source_dates_per_checkpoint = 1
resume_requires_exact_run_fingerprint = true
resume_requires_exact_cache_manifest = true
resume_requires_preceding_checkpoint_sha256 = true
output_directory = "data/derived/outcomes/checkpoints/phase1a_p1_05_outcome_replay_v1"

[results]
artifact_schema = "systematic_fx.phase1a_p1_05_outcome_replay.v1"
output_directory = "data/derived/outcomes/phase1a_p1_05_outcome_replay_v1"
append_only_postgresql_registry = true
required_scenarios = ["BASELINE", "MODERATE_COMBINED", "SEVERE_DIAGNOSTIC"]
required_directions = ["LONG", "SHORT"]
expected_grid_cell_count = 484
expected_scenario_direction_cell_count = 2904
record_every_signal = true
record_every_grid_cell = true
record_entry_not_filled = true
record_skipped_occupied = true
record_censored = true
record_terminal_exit = true
record_all_execution_variables = true

[campaign_sequence]
first_query_id = "p5_01_range_expansion_flow_continuation"
second_query_id = "p1_05_unconfirmed_move_reversal"
second_query_may_start_after = "P5_COMPLETE_AND_LINEAGE_RESUME_AUDIT_PASSED"
