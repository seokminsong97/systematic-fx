[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-fx"
version = "0.1.0"
description = "CME 6E systematic research and deterministic backtesting"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "polars",
    "psycopg[binary]",
    "pyarrow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "pytest-cov",
    "ruff",
]
research = [
    "matplotlib",
    "scikit-learn",
    "scipy",
    "statsmodels",
]
publication = [
    "jsonschema[format-nongpl]",
]
notebook = [
    "ipykernel",
    "jupyterlab",
]

[project.scripts]
systematic-fx = "systematic_fx.cli:main"
systematic-fx-publisher = "systematic_fx.publication.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["systematic_fx"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
