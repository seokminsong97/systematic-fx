[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-fx"
version = "0.1.0"
description = "CME 6E systematic research and deterministic backtesting"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "alembic",
    "polars",
    "psycopg[binary]",
    "pyarrow",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
systematic-fx = "systematic_fx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
